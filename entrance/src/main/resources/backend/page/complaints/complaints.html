<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客服投诉处理页面</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="../../plugins/element-ui/index.css"/>
    <link rel="stylesheet" href="../../styles/common.css"/>
    <link rel="stylesheet" href="../../styles/page.css"/>
</head>
<body>
<div class="dashboard-container" id="customer-service-app">
    <div class="container">
        <!-- 投诉列表 -->
        <el-table :data="complaintData" stripe class="tableBox">
            <el-table-column prop="id" label="投诉ID"></el-table-column>
            <el-table-column prop="complainant" label="买家ID"></el-table-column>
            <el-table-column prop="orderId" label="订单ID"></el-table-column>
            <el-table-column prop="respondent" label="卖家ID"></el-table-column>
            <el-table-column prop="createTime" label="投诉时间"></el-table-column>
            <el-table-column prop="status" label="状态">
                <template slot-scope="scope">
                    {{ formatStatus(scope.row.status) }}
                </template>
            </el-table-column>
            <el-table-column label="操作" width="120" align="center">
                <template slot-scope="scope">
                    <el-button v-if="scope.row.status===1" type="text" size="small" @click="viewComplaint(scope.row)">第一步处理</el-button>
                    <el-button v-if="scope.row.status===2" type="text" size="small" disabled>商家处理中</el-button>
                    <el-button v-if="scope.row.status===3" type="text" size="small" @click="viewComplaint(scope.row)">第二步处理</el-button>
                    <el-button v-if="scope.row.status===4" type="text" size="small" disabled>已完成</el-button>
                </template>
            </el-table-column>
        </el-table>

        <!-- 投诉处理详情窗口 -->
        <el-dialog :title="`投诉详情 - ${complaintDetail.status === 1 ? '客服分析投诉' : '客服反馈结果'}`" :visible.sync="complaintDialogVisible" width="40%" append-to-body>
            <el-form v-if="complaintDetail.status == 1" label-width="120px">
                <!-- 客服分析投诉步骤 -->
                <el-form-item label="订单ID">
                    <span>{{complaintDetail.orderId}}</span>
                </el-form-item>
                <el-form-item label="买家ID">
                    <span>{{complaintDetail.respondent}}</span>
                </el-form-item>
                <el-form-item label="投诉时间">
                    <span>{{complaintDetail.createTime}}</span>
                </el-form-item>
                <el-form-item label="投诉内容">
                    <span>{{complaintDetail.description}}</span>
                </el-form-item>
                <el-form-item label="图片证据">
                    <el-image v-for="image in complaintDetail.images" :src="image" style="width: 100px; margin-right: 10px;"></el-image>
                </el-form-item>
                <el-form-item label="处理反馈建议">
                    <el-input type="textarea" v-model="feedback" placeholder="填写客服的初步建议"></el-input>
                </el-form-item>
            </el-form>

            <el-form v-if="complaintDetail.status === 3" label-width="120px">
                <!-- 客服反馈结果步骤 -->
                <el-form-item label="订单ID">
                    <span>{{complaintDetail.orderId}}</span>
                </el-form-item>
                <el-form-item label="买家ID">
                    <span>{{complaintDetail.respondent}}</span>
                </el-form-item>
                <el-form-item label="卖家反馈">
                    <span>{{complaintDetail.sellerResponse}}</span>
                </el-form-item>
                <el-form-item label="客服建议">
                    <span>{{complaintDetail.feedback}}</span>
                </el-form-item>
                <el-form-item label="最终反馈结果">
                    <el-input type="textarea" v-model="finalResolution" placeholder="输入反馈给买家的最终处理结果"></el-input>
                </el-form-item>
            </el-form>
                <span slot="footer" class="dialog-footer">
                    <el-button size="medium" @click="complaintDialogVisible = false">取消</el-button>
                    <el-button type="primary" size="medium" v-if="complaintDetail.status === 1" @click="sendToSeller()">提交并等待卖家反馈</el-button>
                    <el-button type="primary" size="medium" v-if="complaintDetail.status === 3" @click="submitResolution()">提交反馈</el-button>
                </span>
        </el-dialog>
    </div>
</div>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/complaints.js"></script>
<script>
    new Vue({
        el: '#customer-service-app',
        data() {
            return {
                complaintData: [], // 投诉列表数据
                complaintDetail: {}, // 投诉详情数据
                feedback: '', // 客服反馈建议
                finalResolution: '', // 最终反馈结果
                complaintDialogVisible: false, // 控制详情窗口显示
               // status,当前步骤，1表示客服第一步处理,2表示等待商家处理,3表示客服第二次处理,4表示处理完毕
            }
        },
        created() {
            this.loadComplaints();
        },
        methods: {
            formatStatus(status) {// 格式化状态
                switch (status) {
                    case 1:
                        return '等待客服处理';
                    case 2:
                        return '商家处理中';
                    case 3:
                        return '等待最终反馈';
                    case 4:
                        return '投诉已完成';
                    default:
                        return '未知状态';
                }
            },
                async loadComplaints(){
                    try{const response = await getComplainList({ page: 1, size: 10 });
                    //将response.data中每一个data值都转化为对象
                    this.complaintData = response.data.map(item => ({
                        ...item,
                        data: JSON.parse(item.data),
                    }));
                    }catch (error){
                        console.error('获取投诉列表失败:', error);
                    };
                // 示例数据
                // this.complaintData = [
                //     {complainant: 1, orderId: '2024111101', respondent: '买家A', createTime: '2024-11-11', description: '商品描述不符', status:1,sellerResponse:'',feedback:'',finalResolution:''},
                //     {complainant: 3, orderId: '2024111103', respondent: '买家C', createTime: '2024-11-12', description: '价格不符', status:2,sellerResponse:'已收到您的反馈，我们会尽快处理',feedback:'',finalResolution:''},
                //     {complainant: 2, orderId: '2024111102', respondent: '买家B', createTime: '2024-11-10', description: '物流延迟', status:3,sellerResponse:'已经给用户发放赔偿金',feedback:'请加快物流处理，考虑换用运输公司，或者给出赔偿',finalResolution:''},
                //     {complainant: 4, orderId: '2024111104', respondent: '买家D', createTime: '2024-11-13', description: '商品质量问题', status:4,sellerResponse:'已退款，已发货',feedback:'',finalResolution:'已退款，已发货'}
                // ];
            },
            async viewComplaint(row) {
                console.log(row.data)
                this.complaintDetail = {
                    id: row.id,
                    complainant: row.complainant,
                    orderId: row.orderId,
                    respondent: row.respondent,
                    createTime: row.createTime,
                    description: row.data.description,
                    status: row.status,
                    sellerResponse: row.data.sellerResponse,
                    feedback:row.data.feedback,
                    finalResolution: row.data.finalResolution,
                };
                this.complaintDialogVisible = true; // 设置弹窗显示
            },
            async sendToSeller() {
                // 构造 Complaint 对象
                const complaint = {
                    id: this.complaintDetail.id,
                    orderId: this.complaintDetail.orderId,
                    complainant: this.complaintDetail.complainant,
                    respondent: this.complaintDetail.respondent,
                    data: JSON.stringify({ // 将 data 转为 JSON 字符串
                        description: this.complaintDetail.description,
                        feedback: this.feedback,
                    }),
                };
                // 提交初步处理建议，并将状态设置为“等待卖家处理中”
                try {
                    await treatment(complaint); //提交处理建议
                    this.$message.success('已提交处理建议，等待卖家反馈');
                    this.complaintDialogVisible = false;
                    this.loadComplaints();
                } catch (error) {
                    console.error('提交处理建议失败:', error);
                }
                // 重置反馈建议
                this.feedback = '';
            },
             async submitResolution() {
                 const complaint = {
                     id: this.complaintDetail.id,
                     orderId: this.complaintDetail.orderId,
                     complainant: this.complaintDetail.complainant,
                     respondent: this.complaintDetail.respondent,
                     data: JSON.stringify({ // 将 data 转为 JSON 字符串
                         description: this.complaintDetail.description,
                         feedback: this.complaintDetail.feedback,
                         finalResolution:this.finalResolution,
                     }),
                 };
                // 提交最终反馈结果并关闭窗口
                try {
                    await result(complaint); // 提交最终结果
                    this.$message.success('投诉处理反馈已提交');
                    this.complaintDialogVisible = false;
                    this.loadComplaints();
                } catch (error) {
                    console.error('提交投诉处理反馈失败:', error);
                }
                // 重置最终反馈
                this.finalResolution = '';
            },
        }
    });
</script>
</body>
</html>
